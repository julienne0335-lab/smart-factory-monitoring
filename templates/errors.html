<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트팩토리 에러 현황</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="main-nav">
  <div class="nav-links">
    <a href="/">🤖 로봇 목록</a>
    <a href="/errors" class="active">⚠️ 에러 현황</a>
    <a href="/worklogs">📋 워크로그 조회</a>
  </div>

  <div class="nav-right">
    <select id="factory-select">
      <option value="1">서울공장</option>
      <option value="2">부산공장</option>
      <option value="3">인천공장</option>
    </select>

    <div class="notif-wrapper">
      <button id="notif-bell" class="bell-btn">
        🔔
        <span id="notif-badge" class="notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown">
        <ul id="notif-list"></ul>
      </div>
    </div>
  </div>
</nav>

  <h1>⚠️ 에러 현황판</h1>

  <!-- ===================================================================
       섹션 1. 로봇별 에러 통계
       - GET /api/errors/stats/robot 결과를 카드/표 형태로 보여준다.
       - 데이터 예: [{"robot_id": 1, "total_count": 5}, ...]
       =================================================================== -->
  <h2>로봇별 에러 발생 건수</h2>
  <p id="stats-status-message" class="status-message"></p>

  <table id="stats-table">
    <thead>
      <tr>
        <th>로봇 ID</th>
        <th>누적 에러 건수</th>
      </tr>
    </thead>
    <tbody id="stats-table-body">
      <!-- errors.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <hr class="section-divider">

  <!-- ===================================================================
       섹션 2. 미해결 에러 목록
       - GET /api/errors/unresolved 결과를 표로 보여준다.
       - status가 'pending'(미해결)인 에러만 내려오는 API라서
         is_pending 값은 항상 true로 옴 (그래도 화면에서 표시는 해줌)
       =================================================================== -->
  <h2>미해결 에러 목록</h2>
  <button onclick="loadUnresolvedErrors()">새로고침</button>
  <p id="unresolved-status-message" class="status-message"></p>

  <table id="unresolved-table">
    <thead>
      <tr>
        <th>에러 ID</th>
        <th>로봇 ID</th>
        <th>에러 유형</th>
        <th>상태</th>
        <th>발생 시각</th>
      </tr>
    </thead>
    <tbody id="unresolved-table-body">
      <!-- errors.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/realtime.js"></script>  
  <script src="/static/js/errors.js"></script>
</body>
</html>
