<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트팩토리 에러 현황</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="main-nav">
  <div class="nav-links">
    <a href="/">🤖 로봇 목록</a>
    <a href="/errors" class="active">⚠️ 에러 현황</a>
    <a href="/worklogs">📋 워크로그 조회</a>
  </div>

  <div class="nav-right">
    <select id="factory-select">
      <option value="1">서울공장</option>
      <option value="2">부산공장</option>
      <option value="3">인천공장</option>
    </select>

    <div class="notif-wrapper">
      <button id="notif-bell" class="bell-btn">
        🔔
        <span id="notif-badge" class="notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown">
        <ul id="notif-list"></ul>
      </div>
    </div>

    <!-- 10단계: 로그인 정보 표시 + 로그아웃 (session은 Flask가 템플릿에 자동으로 넘겨줌) -->
    <div class="admin-info">
      <span>{{ session.admin.name }}님 ({{ '공장 반장' if session.admin.role == '슈퍼' else '라인 반장' }})</span>
      <form method="POST" action="/logout" class="logout-form">
        <button type="submit">로그아웃</button>
      </form>
    </div>
  </div>
</nav>

  <h1>⚠️ 에러 현황판</h1>

  <!-- ===================================================================
       섹션 1. 로봇 에러 통합검색
       - GET /api/errors/robot/search 를 호출한다.
       - 로봇ID/라인ID/에러유형/상태/발생일 범위를 자유롭게 조합해서 검색.
       - 상태 기본값을 "미처리"로 둬서, "지금 당장 처리해야 할 것"이
         먼저 보이게 함 (통계 섹션은 누적 집계라 급하지 않으므로 맨 아래로 이동).
       =================================================================== -->
  <h2>🤖 로봇 에러 통합검색</h2>

  <form id="robot-error-search-form">
    <div class="filter-grid">
      <label>
        로봇 ID:
        <input type="number" id="re-filter-robot-id" placeholder="예: 5" min="1">
      </label>
      <label>
        라인 ID:
        <input type="number" id="re-filter-line-id" placeholder="예: 2" min="1">
      </label>
      <label>
        에러 유형:
        <select id="re-filter-error-type">
          <option value="">전체</option>
          <option value="센서이상">센서이상</option>
          <option value="충돌">충돌</option>
          <option value="낙상">낙상</option>
          <option value="과부하">과부하</option>
          <option value="통신오류">통신오류</option>
        </select>
      </label>
      <label>
        상태:
        <select id="re-filter-status">
          <option value="">전체</option>
          <option value="미처리" selected>미처리</option>
          <option value="완료">완료</option>
        </select>
      </label>
      <label>
        시작일:
        <input type="date" id="re-start-date">
      </label>
      <label>
        종료일:
        <input type="date" id="re-end-date">
      </label>
    </div>
    <button type="submit">검색</button>
  </form>

  <p id="robot-error-status-message" class="status-message"></p>

  <table id="robot-error-table">
    <thead>
      <tr>
        <th>에러 ID</th>
        <th>로봇 ID</th>
        <th>에러 유형</th>
        <th>상태</th>
        <th>발생 시각</th>
      </tr>
    </thead>
    <tbody id="robot-error-table-body">
      <!-- errors.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <div id="robot-error-pagination-controls" class="pagination-controls" style="display: none;">
    <button id="robot-error-prev-btn" type="button">← 이전</button>
    <span id="robot-error-page-indicator" class="page-indicator"></span>
    <button id="robot-error-next-btn" type="button">다음 →</button>
  </div>

  <hr class="section-divider">

  <!-- ===================================================================
       섹션 2. 라인 에러 검색
       - GET /api/errors/line/search 를 호출한다.
       - 라인ID/공장/에러유형/상태/발생일 범위를 조합해서 검색.
       - 상태 기본값을 "미처리"로 통일 (섹션 1과 같은 "지금 급한 것 먼저" 원칙).
       =================================================================== -->
  <h2>🏭 라인 에러 검색</h2>

  <form id="line-error-search-form">
    <div class="filter-grid">
      <label>
        라인 ID:
        <input type="number" id="le-filter-line-id" placeholder="예: 2" min="1">
      </label>
      <label>
        공장:
        <select id="le-filter-factory-id">
          <option value="">전체</option>
          <option value="1">서울공장</option>
          <option value="2">부산공장</option>
          <option value="3">인천공장</option>
        </select>
      </label>
      <label>
        에러 유형:
        <select id="le-filter-error-type">
          <option value="">전체</option>
          <option value="설비고장">설비고장</option>
          <option value="전력이상">전력이상</option>
          <option value="원자재부족">원자재부족</option>
          <option value="안전사고">안전사고</option>
          <option value="기타">기타</option>
        </select>
      </label>
      <label>
        상태:
        <select id="le-filter-status">
          <option value="">전체</option>
          <option value="미처리" selected>미처리</option>
          <option value="완료">완료</option>
        </select>
      </label>
      <label>
        시작일:
        <input type="date" id="le-start-date">
      </label>
      <label>
        종료일:
        <input type="date" id="le-end-date">
      </label>
    </div>
    <button type="submit">검색</button>
  </form>

  <p id="line-error-status-message" class="status-message"></p>

  <table id="line-error-table">
    <thead>
      <tr>
        <th>에러 ID</th>
        <th>라인 ID</th>
        <th>에러 유형</th>
        <th>상태</th>
        <th>발생 시각</th>
      </tr>
    </thead>
    <tbody id="line-error-table-body">
      <!-- errors.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <div id="line-error-pagination-controls" class="pagination-controls" style="display: none;">
    <button id="line-error-prev-btn" type="button">← 이전</button>
    <span id="line-error-page-indicator" class="page-indicator"></span>
    <button id="line-error-next-btn" type="button">다음 →</button>
  </div>

  <hr class="section-divider">

  <!-- ===================================================================
       섹션 3. 로봇별 에러 통계 (누적 — 참고용이라 맨 아래로 이동)
       - GET /api/errors/stats/robot 결과를 표 형태로 보여준다.
       - 완료/미처리 구분 없이 "그 로봇에서 지금까지 발생한 전체 건수"를
         집계한 것이라, 위 두 섹션(지금 당장 처리할 것)과 성격이 다름 —
         "이 로봇이 유독 말썽이 잦다" 같은 패턴 파악용 참고 정보.
       =================================================================== -->
  <h2>📊 로봇별 누적 에러 건수</h2>
  <p id="stats-status-message" class="status-message"></p>

  <table id="stats-table">
    <thead>
      <tr>
        <th>로봇 ID</th>
        <th>누적 에러 건수</th>
      </tr>
    </thead>
    <tbody id="stats-table-body">
      <!-- errors.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/realtime.js"></script>  
  <script src="/static/js/errors.js"></script>
</body>
</html>
