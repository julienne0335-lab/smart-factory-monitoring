<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트팩토리 워크로그 조회</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="main-nav">
  <div class="nav-links">
    <a href="/">🤖 로봇 목록</a>
    <a href="/errors">⚠️ 에러 현황</a>
    <a href="/worklogs" class="active">📋 워크로그 조회</a>
  </div>

  <div class="nav-right">
    <select id="factory-select">
      <option value="1">서울공장</option>
      <option value="2">부산공장</option>
      <option value="3">인천공장</option>
    </select>

    <div class="notif-wrapper">
      <button id="notif-bell" class="bell-btn">
        🔔
        <span id="notif-badge" class="notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown">
        <ul id="notif-list"></ul>
      </div>
    </div>
  </div>
</nav>

  <h1>📋 워크로그 조회</h1>

  <!--
    WorkLog 테이블은 100만 건이라 "전체 조회" API가 아예 없다.
    (있어도 절대 호출하면 안 됨 — 브라우저와 DB 둘 다 멈출 수 있음)
    그래서 반드시 날짜 범위를 지정해서 GET /api/worklogs/date?start=...&end=...
    로 조회하는 방식만 제공한다.
  -->
  <p class="hint-text">
    ※ 데이터가 100만 건이라 전체 조회는 지원하지 않습니다. 날짜 범위를 지정해서 조회하세요.
    (더미데이터는 2024년 1월~12월 사이에 분포되어 있습니다)
  </p>

  <!--
    <form>이지만 submit 시 페이지가 새로고침되지 않도록
    worklogs.js에서 이 폼의 기본 제출 동작을 막고(preventDefault)
    fetch()로 대신 처리한다.
  -->
  <form id="search-form">
    <label>
      시작일:
      <input type="date" id="start-date" value="2024-01-01" required>
    </label>
    <label>
      종료일:
      <input type="date" id="end-date" value="2024-01-07" required>
    </label>
    <button type="submit">조회</button>
  </form>

  <p id="worklog-status-message" class="status-message"></p>

  <table id="worklog-table">
    <thead>
      <tr>
        <th>로그 ID</th>
        <th>로봇 ID</th>
        <th>작업 유형</th>
        <th>작업 주체</th>
        <th>시작 시각</th>
        <th>종료 시각</th>
        <th>작업 시간(분)</th>
      </tr>
    </thead>
    <tbody id="worklog-table-body">
      <!-- worklogs.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/realtime.js"></script>
  <script src="/static/js/worklogs.js"></script>
</body>
</html>
