<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트팩토리 워크로그 조회</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="main-nav">
  <div class="nav-links">
    <a href="/">🤖 로봇 목록</a>
    <a href="/errors">⚠️ 에러 현황</a>
    <a href="/worklogs" class="active">📋 워크로그 조회</a>
  </div>

  <div class="nav-right">
    <select id="factory-select">
      <option value="1">서울공장</option>
      <option value="2">부산공장</option>
      <option value="3">인천공장</option>
    </select>

    <div class="notif-wrapper">
      <button id="notif-bell" class="bell-btn">
        🔔
        <span id="notif-badge" class="notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown">
        <ul id="notif-list"></ul>
      </div>
    </div>

    <!-- 10단계: 로그인 정보 표시 + 로그아웃 (session은 Flask가 템플릿에 자동으로 넘겨줌) -->
    <div class="admin-info">
      <span>{{ session.admin.name }}님 ({{ '공장 반장' if session.admin.role == '슈퍼' else '라인 반장' }})</span>
      <form method="POST" action="/logout" class="logout-form">
        <button type="submit">로그아웃</button>
      </form>
    </div>
  </div>
</nav>

  <h1>📋 워크로그 조회</h1>

  <!--
    WorkLog 테이블은 100만 건이라 "조건 없는 전체 조회"는 지원하지 않는다.
    (있어도 절대 호출하면 안 됨 — 브라우저와 DB 둘 다 멈출 수 있음)
    대신 로봇/라인/작업유형/작업주체/날짜범위/최소작업시간을 자유롭게
    조합해서 GET /api/worklogs/search로 좁혀서 조회한다.
  -->
  <p class="hint-text">
    ※ 데이터가 100만 건이라 조건을 하나 이상 선택해서 조회하세요.
    (더미데이터는 2024년 1월~12월 사이에 분포되어 있습니다)
  </p>

  <!--
    <form>이지만 submit 시 페이지가 새로고침되지 않도록
    worklogs.js에서 이 폼의 기본 제출 동작을 막고(preventDefault)
    fetch()로 대신 처리한다.
  -->
  <form id="search-form">
    <div class="filter-grid">
      <label>
        로봇 ID:
        <input type="number" id="filter-robot-id" placeholder="예: 5" min="1">
      </label>
      <label>
        라인 ID:
        <input type="number" id="filter-line-id" placeholder="예: 2" min="1">
      </label>
      <label>
        공장:
        <select id="filter-factory-id">
          <option value="">전체</option>
          <option value="1">서울공장</option>
          <option value="2">부산공장</option>
          <option value="3">인천공장</option>
        </select>
      </label>
      <label>
        작업 유형:
        <select id="filter-work-type">
          <option value="">전체</option>
          <optgroup label="서울공장 (자동차)">
            <option value="용접">용접</option>
            <option value="도장">도장</option>
            <option value="조립">조립</option>
            <option value="품질검사">품질검사</option>
            <option value="부품이송">부품이송</option>
          </optgroup>
          <optgroup label="부산공장 (반도체)">
            <option value="웨이퍼절삭">웨이퍼절삭</option>
            <option value="노광">노광</option>
            <option value="식각">식각</option>
            <option value="세정">세정</option>
            <option value="검사">검사</option>
          </optgroup>
          <optgroup label="인천공장 (식품)">
            <option value="원료투입">원료투입</option>
            <option value="가공">가공</option>
            <option value="포장">포장</option>
            <option value="살균">살균</option>
            <option value="출하검사">출하검사</option>
          </optgroup>
        </select>
      </label>
      <label>
        작업 주체:
        <select id="filter-worker-type">
          <option value="">전체</option>
          <option value="ROBOT">ROBOT</option>
          <option value="HUMAN">HUMAN</option>
        </select>
      </label>
      <label>
        시작일:
        <input type="date" id="start-date" value="2024-01-01">
      </label>
      <label>
        종료일:
        <input type="date" id="end-date" value="2024-01-07">
      </label>
      <label>
        최소 작업시간(분):
        <input type="number" id="filter-min-minutes" placeholder="예: 90" min="0">
      </label>
    </div>
    <button type="submit">조회</button>
  </form>

  <p id="worklog-status-message" class="status-message"></p>

  <table id="worklog-table">
    <thead>
      <tr>
        <th>로그 ID</th>
        <th>로봇 ID</th>
        <th>작업 유형</th>
        <th>작업 주체</th>
        <th>시작 시각</th>
        <th>종료 시각</th>
        <th>작업 시간(분)</th>
      </tr>
    </thead>
    <tbody id="worklog-table-body">
      <!-- worklogs.js가 여기에 <tr>을 채워 넣음 -->
    </tbody>
  </table>

  <!--
  페이지네이션 컨트롤
  - 결과가 1페이지뿐이면 worklogs.js가 이 영역 자체를 숨김
  - "이전/다음" 버튼은 날짜를 안 바꾸고 페이지만 이동함
-->
<div id="pagination-controls" class="pagination-controls" style="display: none;">
  <button id="prev-page-btn" type="button">← 이전</button>
  <span id="page-indicator"></span>
  <button id="next-page-btn" type="button">다음 →</button>
</div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/realtime.js"></script>
  <script src="/static/js/worklogs.js"></script>
</body>
</html>
