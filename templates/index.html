<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트팩토리 로봇 모니터링</title>

  <!--
    static 폴더 안의 CSS 파일을 연결한다.
    Flask는 /static/... 경로로 static 폴더 내용물을 자동으로 서빙해준다.
    (별도 라우트를 만들 필요 없음 — Flask 기본 기능)
  -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!--
    공통 네비게이션 바.
    페이지 3개(로봇/에러/워크로그)를 오가는 단순 링크 모음.
    각 페이지(templates/*.html)에 동일하게 복사해서 넣는다.
    현재 페이지에는 "active" 클래스를 붙여 강조 표시한다.
  -->
<nav class="main-nav">
  <div class="nav-links">
    <a href="/" class="active">🤖 로봇 목록</a>
    <a href="/errors">⚠️ 에러 현황</a>
    <a href="/worklogs">📋 워크로그 조회</a>
  </div>

  <div class="nav-right">
    <select id="factory-select">
      <option value="1">서울공장</option>
      <option value="2">부산공장</option>
      <option value="3">인천공장</option>
    </select>

    <div class="notif-wrapper">
      <button id="notif-bell" class="bell-btn">
        🔔
        <span id="notif-badge" class="notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown">
        <ul id="notif-list"></ul>
      </div>
    </div>

    <!-- 10단계: 로그인 정보 표시 + 로그아웃 (session은 Flask가 템플릿에 자동으로 넘겨줌) -->
    <div class="admin-info">
      <span>{{ session.admin.name }}님 ({{ '공장 반장' if session.admin.role == '슈퍼' else '라인 반장' }})</span>
      <form method="POST" action="/logout" class="logout-form">
        <button type="submit">로그아웃</button>
      </form>
    </div>
  </div>
</nav>

  <h1>🤖 로봇 목록 대시보드</h1>

  <!--
    필터 폼 — 조건 없이 제출하면 전체 로봇을 조회한다 (75대뿐이라 안전).
    submit 시 페이지가 새로고침되지 않도록 main.js에서 기본 동작을 막는다.
  -->
  <form id="robot-search-form">
    <div class="filter-grid">
      <label>
        로봇 ID:
        <input type="number" id="filter-robot-id" placeholder="예: 5" min="1">
      </label>
      <label>
        라인 ID:
        <input type="number" id="filter-line-id" placeholder="예: 2" min="1">
      </label>
      <label>
        공장:
        <select id="filter-factory-id">
          <option value="">전체</option>
          <option value="1">서울공장</option>
          <option value="2">부산공장</option>
          <option value="3">인천공장</option>
        </select>
      </label>
      <label>
        상태:
        <select id="filter-status">
          <option value="">전체</option>
          <option value="가동중">가동중</option>
          <option value="충전중">충전중</option>
          <option value="오류정지">오류정지</option>
          <option value="점검중">점검중</option>
        </select>
      </label>
      <label>
        배터리(%) 이하:
        <input type="number" id="filter-max-battery" placeholder="예: 20" min="0" max="100">
      </label>
      <label>
        마모도(%) 이상:
        <input type="number" id="filter-min-joint-wear" placeholder="예: 80" min="0" max="100">
      </label>
    </div>
    <button type="submit">검색</button>
  </form>

  <!-- 로딩/에러 메시지를 보여줄 자리 (평소엔 비어있음) -->
  <p id="status-message"></p>

  <table id="robot-table">
    <thead>
      <tr>
        <th>로봇 ID</th>
        <th>모델명</th>
        <th>라인 ID</th>
        <th>배터리(%)</th>
        <th>관절 마모도(%)</th>
        <th>상태</th>
      </tr>
    </thead>

    <!--
      tbody의 id="robot-table-body"가 핵심이다.
      main.js에서 document.getElementById('robot-table-body')로 이 태그를 찾아서
      그 안에 <tr> 행들을 자바스크립트로 채워 넣는다.
      지금은 비어있지만, 페이지가 열리면 fetch()로 받아온 데이터로 채워진다.
    -->
    <tbody id="robot-table-body">
      <!-- 여기에 로봇 데이터 행(<tr>)들이 JS로 동적으로 추가됨 -->
    </tbody>
  </table>

  <!--
    페이지네이션 컨트롤 — worklogs.html과 동일한 패턴
    - 결과가 1페이지뿐이면 main.js가 이 영역 자체를 숨김
    - "이전/다음" 버튼은 필터를 안 바꾸고 페이지만 이동함
  -->
  <div id="pagination-controls" class="pagination-controls" style="display: none;">
    <button id="prev-page-btn" type="button">← 이전</button>
    <span id="page-indicator"></span>
    <button id="next-page-btn" type="button">다음 →</button>
  </div>

  <!--
    static 폴더 안의 JS 파일을 연결한다.
    </body> 바로 위에 두는 이유:
    HTML 요소(table, tbody 등)들이 먼저 화면에 그려진 다음에
    JS가 실행되어야 document.getElementById()가 요소를 제대로 찾을 수 있기 때문.
  -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/js/realtime.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
