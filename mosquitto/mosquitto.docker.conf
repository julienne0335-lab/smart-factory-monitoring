# =============================================================================
# mosquitto.docker.conf — docker-compose 전용 브로커 설정
# =============================================================================
# mosquitto.conf(로컬 실행용)는 `listener 1883 127.0.0.1`로 loopback만 여는데,
# 컨테이너 안에서 127.0.0.1은 mosquitto 컨테이너 자기 자신만 가리키므로 app
# 컨테이너가 접근할 수 없다. 컨테이너 네트워크 안에서는 서비스명(mosquitto)으로
# 붙으므로 모든 인터페이스를 열어야 하고, 대신 호스트에는 포트를 게시하지
# 않거나 127.0.0.1로만 게시해서(docker-compose.yml 참고) 외부 노출을 막는다.

listener 1883 0.0.0.0
allow_anonymous true

log_type all
