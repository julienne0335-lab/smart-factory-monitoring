# =============================================================================
# mosquitto.conf — 이 프로젝트 전용 로컬 MQTT 브로커 설정 (14.2절 확장)
# =============================================================================
# [실행 방법]
#   winget으로 설치하면 Mosquitto가 Windows 서비스(자동 시작)로 등록되어
#   기본 설정 그대로 localhost:1883에서 익명 pub/sub을 허용한다 — 그 경우
#   이 파일 없이 서비스를 그대로 쓰면 된다(services.msc에서 "mosquitto"로
#   확인 가능). 서비스가 없거나 직접 띄워야 하는 환경이라면 아래처럼
#   이 설정으로 수동 실행한다:
#     "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto\mosquitto.conf -v
#   (이미 서비스가 1883을 점유하고 있으면 수동 실행은 포트 충돌로 즉시
#    종료된다 — 둘 중 하나만 떠 있어야 한다)
#
# [왜 전역 설정을 안 건드리고 이 파일을 따로 두는가]
#   Windows용 mosquitto 설치본은 기본적으로 로컬호스트에서만 리스닝하도록
#   깔리지만, 인증(allow_anonymous) 설정이 배포판마다 달라 우리 시뮬레이터가
#   바로 붙지 못할 수 있다. 전역 mosquitto.conf를 고치는 대신 이 프로젝트
#   전용 설정 파일을 -c로 넘겨서 실행하면, 다른 프로젝트나 시스템 설정에
#   영향을 주지 않고 이 프로젝트에서 뭘 켰는지 git으로 그대로 추적된다.
#
# [보안 참고]
#   allow_anonymous true + listener 1883은 "인증 없이 로컬호스트에서만
#   접속 허용"이라는 뜻이다. 포트를 0.0.0.0으로 열지 않았으므로 같은
#   PC 밖에서는 접근할 수 없다 — 로컬 개발/데모 용도로만 쓰는 설정이며
#   실제 배포(Render 등)에는 이 브로커를 그대로 올리지 않는다(7장 참고:
#   Render의 gunicorn 워커 제약과 무관하게, 애초에 14장은 로컬 아키텍처
#   검증이 목적이라고 밝혀둔 것과 같은 맥락).
# =============================================================================

listener 1883 127.0.0.1
allow_anonymous true

# 콘솔에 pub/sub 로그를 그대로 출력 (데모 중 실시간으로 눈으로 확인하기 위함)
log_type all
